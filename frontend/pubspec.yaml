name: kirayaease_flutter
description: A Flutter implementation of the KirayaEase rent payment platform.
publish_to: 'none' # Prevents publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^0.13.6
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  video_player: ^2.7.0
  razorpay_flutter: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/rent_mockup.png
    - assets/logo.png
    - assets/intro_video.mp4
    - assets/razorpay.png