name: kirayaease_flutter
description: A Flutter implementation of the KirayaEase rent payment platform.
publish_to: 'none' # Prevents publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.2.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  video_player: ^2.7.0
  razorpay_flutter: ^1.4.0
  permission_handler: ^11.3.1
  file_picker: ^10.3.2
  kyc_workflow: ^2.0.8
  intl: ^0.20.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^7.2.0
  share_plus: ^10.0.2
  google_fonts: ^4.0.4
  font_awesome_flutter: ^10.7.0
  pdfrx: ^2.2.20
  flutter_markdown: ^0.7.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/rent_mockup.png
    - assets/logo.png
    - assets/founder_photo.png
    - assets/intro_video.mp4
    - assets/razorpay.png
    - assets/google.png