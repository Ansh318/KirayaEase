# Cloud Build CI/CD — KirayaEase API
#
# Triggered on push to the Dev branch.
# Builds, pushes to Artifact Registry, and deploys to Cloud Run.
#
# Required substitutions (set in Cloud Build trigger):
#   _PROJECT_ID       — GCP project ID
#   _REGION           — Cloud Run region (default: asia-south1)
#   _SERVICE_NAME     — Cloud Run service name (default: kiraya-ease-api)
#   _REPO             — Artifact Registry repo name (default: kiraya-ease)
#   _SQL_INSTANCE     — Cloud SQL instance connection name
#   _DB_NAME          — Cloud SQL database name
#   _DB_USER          — Cloud SQL IAM user or DB user
#   _SERVICE_ACCOUNT  — Cloud Run service account email

substitutions:
  _REGION: asia-south1
  _SERVICE_NAME: kiraya-ease-api
  _REPO: kiraya-ease
  _DB_NAME: kirayaease

steps:
  # ── 1. Build Docker image ──────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - build
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - -t
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest'
      - -f
      - dockerfile
      - .
    waitFor: ['-']

  # ── 2. Push to Artifact Registry ──────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}'
    waitFor: [build]

  # ── 3. Deploy to Cloud Run ────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--add-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_SQL_INSTANCE}'
      - '--set-env-vars=CLOUD_SQL_INSTANCE=${PROJECT_ID}:${_REGION}:${_SQL_INSTANCE}'
      - '--set-env-vars=DB_NAME=${_DB_NAME}'
      - '--set-env-vars=DB_USER=${_DB_USER}'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID}'
      - '--set-env-vars=PRIVATE_IP=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--concurrency=80'
      - '--timeout=300'
      - '--port=8080'
    waitFor: [push]

# Store image in Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
